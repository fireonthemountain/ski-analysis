# Optional full stack (PostgreSQL + MinIO + API + dev UI).
# The app also runs with NO containers: see scripts/run_dev.sh (SQLite + local files).
#
# Secrets are read from .env (copy .env.example to .env first):
#   cp .env.example .env && docker compose up
# A variable written as ${NAME:?...} has no fallback, so compose refuses to start without it.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ski-analysis-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ski_analysis}
      POSTGRES_USER: ${POSTGRES_USER:-skiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skiuser} -d ${POSTGRES_DB:-ski_analysis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ski-analysis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ski-analysis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ski-analysis-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skiuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ski_analysis}
      REDIS_URL: redis://redis:6379/0
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-ski-videos}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATA_DIR: /data
    volumes:
      - backend_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ski-analysis-frontend
    command: npm run dev
    ports:
      - "5177:5177"
    environment:
      VITE_PROXY_TARGET: http://backend:8003
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_data:
